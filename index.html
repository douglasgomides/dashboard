<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <title>Doctor Creator Hub</title>
    <script>
      // Se o arquivo principal sumiu depois de um deploy (aba antiga), recarrega uma vez.
      window.addEventListener(
        "error",
        function (e) {
          var t = e.target;
          if (t && t.tagName === "SCRIPT" && /\/assets\//.test(t.src || "")) {
            try {
              var k = "recarga-por-deploy";
              if (Date.now() - (+sessionStorage.getItem(k) || 0) < 60000) return;
              sessionStorage.setItem(k, String(Date.now()));
            } catch (x) {}
            location.reload();
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
