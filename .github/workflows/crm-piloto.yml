name: Fluxo do Kanban piloto
on:
  pull_request:
    paths:
      - "src/**/crm-*"
      - "src/routes/_authenticated.$clientId.crm-contatos.tsx"
      - "supabase/migrations/*crm_operacao*"
      - "scripts/test-crm-operacao.ts"
      - "tests/e2e/crm-kanban.spec.ts"
      - "tests/e2e/numbers-first.spec.ts"
      - "scripts/verify-nexo-interface.mjs"
      - ".github/workflows/crm-piloto.yml"
permissions:
  contents: read
concurrency:
  group: crm-piloto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fluxo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: http://localhost:9
      VITE_SUPABASE_PUBLISHABLE_KEY: fake-public-test-key
      PLAYWRIGHT_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import ./scripts/test-network-guard.mjs --import tsx scripts/test-crm-operacao.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/crm-kanban.spec.ts tests/e2e/numbers-first.spec.ts --workers=1
      - run: npm run test:interface
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kanban-piloto-evidencias
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
