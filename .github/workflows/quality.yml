name: Qualidade SAP e Nexo

on:
  push:
    branches: [claude/doctor-creator-hub-nixvw6]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: http://localhost:9
      VITE_SUPABASE_PUBLISHABLE_KEY: fake-public-test-key
      PLAYWRIGHT_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix workers/creative --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation2
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix workers/creative --omit=dev --audit-level=moderate
      - run: npm run check
      - run: npm run check --prefix workers/creative
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:interface
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
