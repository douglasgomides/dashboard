name: Alertas de produção

# A cada hora confere a produção (só leitura) e mantém uma issue "alerta-producao" aberta enquanto houver problema:
# coleta parada para todas as clínicas, erro de sincronização, fonte de clínica parada, IA falhando, leitura de
# temas parada. O GitHub avisa por e-mail e no app; a issue fecha sozinha quando tudo volta ao normal.
# Segredo: SUPABASE_DB_URL_PROD (o mesmo do fluxo do banco). Sem ele, registra o aviso no resumo e termina sem erro.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: alertas-producao
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  conferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
    steps:
      - name: Segredo configurado?
        id: segredo
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Sem SUPABASE_DB_URL_PROD: alertas não conferidos." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.segredo.outputs.ok == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - if: steps.segredo.outputs.ok == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.segredo.outputs.ok == 'true'
        name: Conferir produção
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$DB_URL" -qtA -v ON_ERROR_STOP=1 -f scripts/alertas/verificar.sql > alertas.json
          node -e 'const a=require("./alertas.json");console.log(a.length+" alerta(s)");for(const x of a)console.log("- ["+x.gravidade+"] "+x.texto)' | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.segredo.outputs.ok == 'true'
        name: Abrir, atualizar ou fechar a issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts
          npx tsx scripts/alertas/publicar.ts alertas.json
