  <style>

    @media(max-width:950px) { .columns { grid-template-columns:1fr; } .columns>.stack:last-child { display:grid; grid-template-columns:1fr 1fr; align-items:start; } .columns>.stack:last-child>.card:first-child { grid-column:1/-1; } .toolbar { flex-wrap:wrap; } .toolbar-start { flex:1; justify-content:space-between; } .toolbar-end { margin-left:auto; } .summary-cell { padding:16px; gap:10px; } }

ialog-footer .actions>.primary { flex:1; } .metrics-grid { grid-template-columns:1fr; gap:10px; } .metric strong { margin:4px 0; } .chart-row { grid-template-columns:90px 1fr 40px; gap:9px; font-size:12px; } #live { bottom:90px; } }
    /* The mobile entry prioritizes the first decision; D0–D90 remains in the header. */
    @media(max-width:700px) { .program { display:none; } }

    /* The public pages and workspace share the existing navy, blue and brass identity. */
    :root { --page:#f6f7f8; --ink:#152033; --secondary:#4b596d; --muted:#627085; --border:#dfe4ea; --accent:#254d77; --accent-hover:#1d3b5b; --accent-soft:#edf2f7; --side:#111d2e; --ai:#52627b; --sap:#795a2c; --shadow:none; --brass:#b58f59; }
    :root[data-theme="dark"] { --page:#0d1522; --surface:#142031; --surface-2:#1d2a3c; --ink:#e8edf4; --secondary:#c5cedb; --muted:#a1b0c3; --border:#304156; --accent:#365e89; --accent-hover:#426c99; --accent-soft:#22364c; --side:#0a111d; --ai:#b2c0d1; --brass:#c6a46f; }
    body { font-feature-settings:"cv11","ss01"; }
    button, .btn { letter-spacing:.005em; }
    .btn, .icon-button, select, textarea { border-radius:5px; }
    h1 { font-weight:540; letter-spacing:-1.15px; }
    h2 { font-weight:590; }
    .demo-bar { justify-content:space-between; padding:5px 28px; font-size:11px; min-height:36px; }
    .demo-bar strong { font-weight:600; }
    .demo-links { display:flex; align-items:center; gap:16px; }
    .demo-bar button { text-decoration:none; padding:0; color:var(--secondary); }
    .demo-bar button:hover { text-decoration:underline; }
    .workspace { grid-template-columns:236px minmax(0,1fr); min-height:calc(100vh - 36px); }
    .sidebar { padding:30px 18px 22px; gap:43px; }

          <div class="sidebar-footer"><div class="profile"><span class="avatar">${isOperator()?'DC':c.initials}</span><div>${roleName()}<small>${state.role==='admin'?'Carteira e governança':state.role==='team'?'Clínicas atribuídas':state.role==='reception'?'Fila de atendimento':'Resultados e decisões'}</small></div></div><p class="sidebar-note">Agentes identificados. Decisões sob seu controle.</p></div>
        </aside>
        <div class="mainwrap"><header class="toolbar">
          <div class="toolbar-start">${state.role==='admin'?`<div class="product-switch" role="group" aria-label="Produto">${['hub','sap'].map(id=>`<button type="button" data-product="${id}" aria-pressed="${state.product===id}">${products[id].name}</button>`).join('')}</div>`:`<span class="product-label">${p.name}</span>`}
            <div class="client-picker"><div><label for="client">Clínica selecionada</label><select id="client" ${state.role!=='admin'?'disabled':''}>${Object.entries(clients).filter(([id])=>state.role==='admin'||id===session.client).map(([id,v])=>`<option value="${id}" ${state.client===id?'selected':''}>${v.name}</option>`).join('')}</select></div></div>
          </div><div class="toolbar-end"><div class="session-label"><span class="avatar">${state.role==='admin'?'DC':state.role==='team'?'OP':c.initials}</span><strong>${roleName()}</strong></div>
            <button type="button" class="icon-button" data-action="theme" aria-label="${state.theme==='light'?'Ativar tema escuro':'Ativar tema claro'}">${icon('moon')}</button><button type="button" class="logout" data-action="logout">Sair</button>
          </div>
        </header>
        <main id="main"><header class="page-head"><div><div class="eyebrow ${state.product==='sap'?'sap-label':''}">${icon(state.product==='hub'?'activity':'plan')} ${p.description}${state.product==='sap'?` · D${c.day} de 90`:''}</div><h1 id="page-title" tabindex="-1">${({today:state.role==='reception'?'Minha fila':'Visão do dia',plan:state.role==='reception'?'Minha rotina':p.plan,results:'Resultados',modules:'Todas as áreas',activity:state.role==='reception'?'Histórico do atendimento':'Atividade dos agentes'})[state.page]}</h1><p class="sub">${state.page==='today'?(isOperator()?'As decisões da sua equipe, com contexto para agir.':'O que precisa de você e como o trabalho está avançando.'):'Clínica selecionada: '+c.name+' · cenário demonstrativo'}</p></div>
          ${isOperator()?`<button type="button" class="btn primary" data-action="ask" aria-label="Pedir análise">${icon('spark')}<span>Pedir análise</span></button>`:''}
        </header>
        ${state.sourceError?`<div class="source-error" role="alert"><div><strong>Os dados ainda não puderam ser conferidos.</strong><p>As recomendações estão suspensas. Resultados do período ficam indisponíveis até a nova leitura.</p></div><button class="btn" type="button" data-action="retry">${icon('refresh')} Tentar novamente</button></div>`:''}
        ${state.role==='reception'?reception(d):state.page==='today'?today(d,needs):state.page==='plan'?plan(d):state.page==='results'?results():state.page==='modules'?modules():activity(d)}
        <footer class="footnote"><span>Semana de 12 a 18 de outubro · dados demonstrativos</span><label><input id="source-error" type="checkbox" ${state.sourceError?'checked':''}> Simular falha da fonte</label></footer>
        </main></div></div>`;
      document.documentElement.dataset.theme=state.theme;
    }
    function today(d,needs) {
      const active=d.runs.filter(r=>r.status==='running').length;
      return `${state.product==='sap'?`<section class="program" aria-label="Andamento do programa"><div><strong>Implantação e aquisição</strong><p>D${clients[state.client].day} de 90 · próximo passo com responsável e evidência</p></div><div><div class="health"><span class="micro">Tempo decorrido do programa</span><span class="micro">D${clients[state.client].day}/90</span></div><div class="progress" role="progressbar" aria-label="Dias decorridos do programa" aria-valuenow="${clients[state.client].day}" aria-valuemin="0" aria-valuemax="90"><span style="width:${clients[state.client].day/90*100}%"></span></div><p>Dias decorridos não representam entregas concluídas.</p></div></section>`:''}
      <section class="summary" aria-label="Resumo do dia">${[[needs,'Precisam de você','user'],[active,'Em andamento','bot'],[d.completed.length,'Concluído recentemente','check']].map(([value,label,image])=>`<div class="summary-cell"><div class="summary-icon">${icon(image)}</div><div><div class="summary-value">${value}</div><span class="summary-label">${label}</span></div></div>`).join('')}</section>
      <div class="columns"><div class="stack"><section aria-labelledby="decisions-title"><div class="section-head"><h2 id="decisions-title">Precisa de você</h2><small>${needs?`${needs} ${needs===1?'pendência':'pendências'}`:'Sem pendências'}</small></div>
      ${isOperator()&&d.approval==='pending'?decision():''}
      ${!d.clinicTaskDone?clinicTask():''}
      ${needs===0?`<div class="empty">${icon('check')}<h3>Nenhuma decisão pendente</h3><p>Você pode acompanhar o trabalho dos agentes ao lado.</p></div>`:''}
      </section><section class="card"><div class="section-head"><h2>Concluído recentemente</h2>${badge('Registrado','success','check')}</div><div class="done-list">${d.completed.map(t=>`<div class="done-item">${icon('check')}<div>${esc(t)}<small>${clients[state.client].name} · nesta demonstração</small></div></div>`).join('')}</div></section>
      </div><div class="stack"><section class="card"><div class="section-head"><h2>Operação dos agentes</h2>${badge('IA','ai','bot')}</div>${d.runs.map(runCard).join('')}<div class="activity-foot"><button type="button" class="btn link" data-page="activity">Ver todas as atividades ${icon('arrow')}</button></div></section>
      <section class="card health"><div><h3>${state.sourceError?icon('warning')+' Leitura indisponível':'<span class="dot"></span> Fontes conferidas no cenário'}</h3><p>${state.sourceError?'Nenhum dado foi convertido em zero.':'CRM, Instagram e WhatsApp · demonstração'}</p></div>${icon('source')}</section>
      <div class="callout">${icon('shield')} <strong>Supervisão da operação.</strong> ${isOperator()?'Publicações e conclusões de etapas exigem revisão.':'A equipe cuida da execução; suas tarefas aparecem aqui.'}</div>
      </div></div>`;
    }
    function decision() {
      const p=proposal();
      return `<article class="card decision priority"><div class="card-top">${badge('Preparado por agente','ai','bot')}<span class="micro">${p.due}</span></div><h3>${p.title}</h3><p class="description">${p.description}</p><div class="metadata"><span>${icon('shield')} Aguardando sua aprovação</span><span>${icon('user')} Equipe responsável</span></div><div class="card-actions"><button type="button" class="btn primary" data-action="review" ${state.sourceError?'disabled':''}>${p.label} ${icon('arrow')}</button><button type="button" class="btn link" data-action="evidence">Ver evidências</button></div>${state.sourceError?'<p class="form-error">A aprovação fica indisponível até conferir a fonte.</p>':''}</article>`;
    }
    function clinicTask() {
      return `<article class="card decision"><div class="card-top">${badge(isOperator()?'Acompanhar com a clínica':'Sua tarefa','','user')}<span class="micro">Esta semana</span></div><h3>${state.product==='hub'?'Conferir prioridades do próximo período':'Revisar as peças da campanha'}</h3><p class="description">${isOperator()?'A clínica precisa revisar o material. Você pode abrir o contexto e acompanhar o retorno.':'O material está organizado. Veja o que precisa ser conferido e registre sua revisão.'}</p><div class="metadata"><span>${icon('user')} Responsável da clínica</span><span>${icon('clock')} Prazo de revisão · sexta-feira</span></div><div class="card-actions"><button type="button" class="btn" data-action="task">${isOperator()?'Ver tarefa da clínica':'Abrir minha tarefa'} ${icon('chevron')}</button>${badge('Revisão humana')}</div></article>`;
    }
    function runCard(run) {
      return `<article class="run" data-run-id="${run.id}"><div class="run-head"><span class="run-icon">${icon('bot')}</span><div><h3>${esc(run.title)}</h3><p>${esc(run.detail)}</p><div class="run-state">${badge(statusLabel(run.status),run.status==='completed'?'success':run.status==='paused'?'warning':'','')}<span class="micro">Agente · IA</span></div>${isOperator()&&run.status!=='completed'?`<button type="button" class="btn link" data-run="${run.id}" data-action="${run.status==='paused'?'resume':'pause'}">${icon(run.status==='paused'?'play':'pause')} ${run.status==='paused'?'Retomar':'Pausar'}</button>`:''}</div></div></article>`;
    }
    function plan(d) {
      const items=state.product==='hub'?[
        ['Leitura do período','Agente de análise','Em andamento'],['Revisão das prioridades','Responsável da clínica',d.clinicTaskDone?'Concluído':'Precisa de você'],['Relatório semanal','Equipe Doctor Creator',d.approval==='approved'?'Concluído':d.approval==='pending'?'Aguardando revisão':d.approval==='changes'?'Ajuste solicitado':'Em andamento']
      ]:[['Rastreamento e evidências','Equipe de implementação',d.approval==='approved'?'Concluído':'Aguardando revisão'],['Peças da campanha','Responsável da clínica',d.clinicTaskDone?'Concluído':'Precisa de você'],['Treino do atendimento','Equipe de relacionamento','Próxima etapa'],['Anúncios no ar','Gestor de tráfego','Depende das etapas anteriores']];
      return `<section class="card"><div class="section-head"><h2>${state.product==='hub'?'Prioridades do período':'Próximas entregas do programa'}</h2>${badge('Responsável + próximo passo')}</div>${items.map(([title,owner,status],i)=>`<div class="list-row"><span class="numbered">${i+1}</span><div class="row-main"><h3>${title}</h3><p>${owner}</p><div class="metadata">${badge(status,status==='Concluído'?'success':'')}</div></div>${i===1&&!d.clinicTaskDone?'<button type="button" class="btn" data-action="task">Abrir tarefa</button>':''}</div>`).join('')}<div class="callout">${state.product==='sap'?'O cronograma detalhado permanece como fonte das tarefas. Esta visão destaca o responsável e o que depende de cada entrega.':'O plano reúne ações e campanhas. Cada proposta mantém seu vínculo com as evidências e com a atividade do agente.'}</div></section>`;
    }
    function results() {
      const unavailable=state.sourceError;
      return `<div class="callout" style="margin-bottom:20px">${icon('source')} <strong>${unavailable?'Fonte indisponível: resultados suspensos.':'Cenário demonstrativo · semana de 12 a 16 de outubro'}</strong> ${unavailable?'Os valores ausentes não são tratados como zero.':'Valores fictícios para avaliar a organização da tela. Não representam resultado de uma clínica.'}</div><section class="metrics-grid" aria-label="Indicadores do cenário">${[['Conversas iniciadas','120','Origem: WhatsApp'],['Agendamentos','36','Origem: CRM'],['Consultas realizadas','24','Origem: CRM']].map(([label,value,source])=>`<article class="card metric"><h2>${label}</h2><strong>${unavailable?'—':value}</strong><p>${unavailable?'Indisponível até nova leitura':source}</p></article>`).join('')}</section><section class="card"><div class="section-head"><h2>Da conversa à consulta</h2>${badge(unavailable?'Leitura pendente':'Dados simulados')}</div>${unavailable?'<p class="description">Tente novamente na mensagem de erro acima para recuperar a visualização.</p>':`<div class="bar-chart">${[['Conversas',120,100],['Agendamentos',36,30],['Consultas',24,20]].map(([name,value,width])=>`<div class="chart-row"><span>${name}</span><div class="progress"><span style="width:${width}%"></span></div><strong>${value}</strong></div>`).join('')}</div>`}<p class="description" style="margin-top:22px">Uma entrega do agente e uma melhora no resultado são coisas distintas. Esta tela mostra indicadores; a aba Atividade registra o trabalho executado.</p></section>`;
    }
    function activity(d) {
      return `<div class="columns"><section class="card"><div class="section-head"><h2>Trabalho em andamento</h2>${badge('Agentes de IA','ai','bot')}</div>${d.runs.map(runCard).join('')}${d.approval==='changes'?'<div class="callout alert"><strong>Ajuste solicitado</strong><p>O agente recebeu sua orientação. Uma nova proposta exigirá outra revisão.</p></div>':''}<div class="callout" style="margin-top:15px">Pausar interrompe os próximos passos. Uma ação já concluída não é desfeita automaticamente.</div></section><section class="card"><h2 style="margin-bottom:18px">Histórico desta clínica</h2><div class="done-list">${d.events.map(event=>`<div class="done-item">${icon(event.status==='Concluído'?'check':'clock')}<div><p>${esc(event.text)}</p><small>${esc(event.detail)}</small><div style="margin-top:6px">${badge(event.status,event.status==='Concluído'?'success':'')}</div></div></div>`).join('')}</div></section></div>`;
    }
    function showDialog(content,kind) {
      modalContext={key:key(),role:state.role,kind}; dialog.innerHTML=content; dialog.showModal();
    }
    function dialogHeader(title,label='Revisão da proposta') {
      return `<header class="dialog-head"><div><span class="micro">${label} · ${clients[state.client].name} · ${products[state.product].name}</span><h2 id="dialog-title">${title}</h2></div><button type="button" class="icon-button" data-action="close" aria-label="Fechar painel">${icon('close')}</button></header>`;
    }
    function review(evidenceOnly=false) {
      if(!isOperator()||data().approval!=='pending') return;
      const p=proposal();
      showDialog(`${dialogHeader(evidenceOnly?'Evidências da proposta':p.title)}<div class="dialog-body">${badge('Preparado por agente de IA','ai','bot')}
      <p class="description">${evidenceOnly?'Veja as fontes antes de decidir.':'Confira o conteúdo, o destino e o efeito desta aprovação.'}</p>
      ${!evidenceOnly?`<div><h3 style="margin-bottom:9px">O que será aprovado</h3><div class="preview-content">${p.preview}</div></div><div class="review-grid"><div class="review-box"><strong>Antes</strong><p>${p.before}</p></div><div class="review-box"><strong>Depois da aprovação</strong><p>${p.after}</p></div></div><div class="review-box"><strong>Destino</strong><p>${p.destination}</p></div>`:''}
      <div><h3 style="margin-bottom:10px">Base da proposta</h3><ul class="evidence-list">${p.evidence.map(e=>`<li>${icon('source')}<span>${e}</span></li>`).join('')}</ul></div>
      <div class="callout alert">${icon('shield')} <strong>Limite de autonomia:</strong> o agente prepara a proposta. Uma pessoa da equipe precisa aprovar. ${state.product==='hub'?'Um comentário publicado não pode ser desfeito automaticamente.':'Concluir a etapa não comprova, por si só, melhora nos resultados.'}</div>
      ${!evidenceOnly?`<label class="review-check"><input id="review-check" type="checkbox" ${state.sourceError?'disabled':''}><span>Conferi o conteúdo, a clínica e o efeito desta ação.</span></label><div id="change-form" hidden><label class="field-label" for="feedback">O que o agente precisa ajustar?</label><textarea id="feedback" placeholder="Descreva o ajuste necessário…" maxlength="1000"></textarea><p id="feedback-error" class="form-error" role="alert" hidden>Descreva o ajuste antes de enviar.</p></div>`:''}
      <p class="micro">Simulação: nenhuma mensagem, alteração de cronograma ou chamada de IA será enviada.</p></div><footer class="dialog-footer"><button type="button" class="btn link" data-action="close">Voltar</button><div class="actions">${evidenceOnly?'<button type="button" class="btn primary" data-action="review-from-evidence">Revisar proposta</button>':`<button type="button" class="btn" id="request-change" data-action="request-change">Solicitar ajuste</button><button type="button" class="btn primary" id="approve" data-action="approve" disabled>${p.execute}</button>`}</div></footer>`,evidenceOnly?'evidence':'review');
    }
    function task() {
      const team=isOperator();
      showDialog(`${dialogHeader(state.product==='hub'?'Revisar prioridades do período':'Revisar peças da campanha','Tarefa da clínica')}<div class="dialog-body">${badge('Responsável da clínica','','user')}<p class="description">${team?'Esta tarefa depende do retorno da clínica. A equipe acompanha o andamento.':'Confira o material preparado e registre sua revisão. Se houver alguma dúvida, informe o que precisa ser alterado.'}</p><div class="preview-content">${state.product==='hub'?'Prioridades propostas: revisar o atendimento, acompanhar agendamentos e preparar a pauta de conteúdo do próximo período.':'Material demonstrativo: seis peças de campanha e dois roteiros de vídeo organizados para revisão.'}</div><div class="review-box"><strong>Pronto quando</strong><p>${state.product==='hub'?'A clínica revisou as prioridades e registrou as observações.':'A clínica conferiu as peças e registrou o retorno à equipe.'}</p></div>${team?'<div class="callout">A clínica pode registrar a revisão na visualização “Clínica”. A equipe não conclui a tarefa em nome dela neste protótipo.</div>':`<label class="field-label" for="task-note">Observações da revisão <span class="micro">(opcional)</span><textarea id="task-note" maxlength="1000" placeholder="O que a equipe precisa saber?"></textarea></label>`}<p class="micro">O registro acontece somente nesta demonstração.</p></div><footer class="dialog-footer"><button type="button" class="btn" data-action="close">Voltar</button>${!team?'<button type="button" class="btn primary" data-action="complete-task">Registrar minha revisão</button>':''}</footer>`,'task');
    }
    function ask() {
      if(!isOperator()) return;
      showDialog(`${dialogHeader('Que análise você precisa?','Orientar o agente')}<div class="dialog-body"><p class="description">O agente preparará uma análise para ${clients[state.client].name}. Publicar mensagens ou alterar etapas continuará exigindo aprovação.</p><label class="field-label" for="request">Objetivo da análise<textarea id="request" maxlength="1000" placeholder="Ex.: analisar os pontos de perda no atendimento desta semana"></textarea></label><p id="request-error" class="form-error" role="alert" hidden>Descreva o objetivo da análise.</p><div class="review-box"><strong>Escopo desta solicitação</strong><p>Somente a clínica selecionada · ${products[state.product].name} · leitura e preparação de proposta.</p></div><p class="micro">Simulação com dados demonstrativos. Nenhuma chamada de IA ou custo real.</p></div><footer class="dialog-footer"><button type="button" class="btn" data-action="close">Cancelar</button><button type="button" class="btn primary" data-action="start-analysis">Preparar análise ${icon('arrow')}</button></footer>`,'ask');
    }
    function validContext(kind,role='operator') {
      return state.screen==='workspace' && modalContext?.key===key() && modalContext.role===state.role && (!role||(role==='operator'?isOperator():role==='clinic'?isClinic():state.role===role)) && modalContext.kind===kind;
    }
    function approve() {
      if(!validContext('review')||state.sourceError||data().approval!=='pending'||!document.getElementById('review-check')?.checked) return;
      const d=data(), context=key(), p=proposal();
      d.approval='executing';
      d.runs.push({id:'approval',title:p.result,detail:'Executando apenas o cenário demonstrativo aprovado.',status:'running',source:'Proposta revisada'});
      d.events.unshift({text:'Proposta aprovada pela equipe',detail:'Conteúdo, destino e efeito revisados · simulação',status:'Em andamento'});
      closeDialog(); render(); document.getElementById('page-title').focus(); announce('Aprovação registrada. A simulação está em andamento.');
      schedule(()=>{
        const run=d.runs.find(r=>r.id==='approval');
        if(!run||run.status!=='running') return;
        completeApproval(d,run,p.result,context);
      },1300);
    }
    function completeApproval(d,run,title,context) {
      run.status='completed'; run.detail='Simulação concluída. Nenhuma ação foi enviada à operação.'; d.approval='approved';
      d.completed.unshift(title); d.events.unshift({text:title,detail:'Após aprovação humana · nenhuma escrita externa',status:'Concluído'});
      if(key()===context) {render();announce('Simulação concluída. O registro está no histórico desta clínica.');}
    }
    function requestChange() {
      if(!validContext('review')||data().approval!=='pending') return;
      const form=document.getElementById('change-form');
      if(form.hidden) {form.hidden=false;document.getElementById('request-change').textContent='Enviar solicitação';document.getElementById('approve').hidden=true;document.getElementById('feedback').focus();return;}
      const feedback=document.getElementById('feedback').value.trim();
      if(!feedback) {document.getElementById('feedback-error').hidden=false;document.getElementById('feedback').focus();return;}
      const d=data();d.approval='changes';d.feedback=feedback;d.events.unshift({text:'Ajuste solicitado à proposta',detail:feedback,status:'Aguardando ajuste'});
      closeDialog();render();document.getElementById('page-title').focus();announce('Ajuste solicitado. A proposta não foi aprovada nem executada.');
    }
    function controlRun(id,action) {
      if(!isOperator()) return;
      const d=data(),run=d.runs.find(r=>r.id===id);
      if(!run||run.status==='completed') return;
      run.status=action==='pause'?'paused':'running';
      d.events.unshift({text:`${action==='pause'?'Pausa':'Retomada'}: ${run.title}`,detail:'Decisão da equipe · próximos passos controlados',status:action==='pause'?'Pausado':'Em andamento'});
      if(action==='resume'&&id==='approval') {const context=key(),p=proposal();schedule(()=>{if(run.status==='running') completeApproval(d,run,p.result,context);},1300);}
      render();document.querySelector(`[data-run="${id}"]`)?.focus();announce(action==='pause'?'Próximos passos pausados.':'Execução retomada no cenário demonstrativo.');
    }
    document.addEventListener('click',event=>{
      const b=event.target.closest('button'); if(!b||b.disabled)return;
      if(b.dataset.page) {navigate(b.dataset.page);return;}
      if(b.dataset.product) {if(state.role!=='admin'||state.screen!=='workspace')return; go('/'+b.dataset.product+'/painel');return;}
      const action=b.dataset.action;
      if(action==='close')closeDialog();
      if(action==='review')review();
      if(action==='evidence')review(true);
      if(action==='review-from-evidence'){closeDialog();review();}
      if(action==='task')task();
      if(action==='approve')approve();
      if(action==='request-change')requestChange();
      if(action==='ask')ask();
      if(action==='theme'){state.theme=state.theme==='light'?'dark':'light';render();document.querySelector('[data-action="theme"]').focus();}
      if(action==='retry'){state.sourceError=false;render();announce('Leitura recuperada no cenário demonstrativo.');}
      if(action==='pause'||action==='resume')controlRun(b.dataset.run,action);
      if(action==='complete-task'&&validContext('task','clinic')&&!data().clinicTaskDone){const d=data(),note=document.getElementById('task-note').value.trim();d.clinicTaskDone=true;d.completed.unshift('Revisão registrada pela clínica');d.events.unshift({text:'Revisão registrada pela clínica',detail:note||'Sem observações adicionais',status:'Concluído'});closeDialog();render();document.getElementById('page-title').focus();announce('Sua revisão foi registrada nesta demonstração.');}
      if(action==='start-analysis'&&validContext('ask')){const request=document.getElementById('request').value.trim();if(!request){document.getElementById('request-error').hidden=false;document.getElementById('request').focus();return;}const d=data();d.runs.push({id:`request-${d.runs.length}`,title:'Análise solicitada por você',detail:request,status:'running',source:'Dados da clínica selecionada'});d.events.unshift({text:'Nova análise solicitada',detail:request,status:'Em andamento'});closeDialog();state.page='activity';render();document.getElementById('page-title').focus();announce('Análise adicionada à atividade desta clínica. Nenhuma IA real foi acionada.');}

    function reception(d) {
      if(state.page==='activity')return `<section class="card"><h2>Histórico da minha rotina</h2><div class="done-list" style="margin-top:22px">${d.events.filter(e=>/revisão|rotina/i.test(e.text)).map(e=>`<div class="done-item">${icon('check')}<div><p>${esc(e.text)}</p><small>${esc(e.detail)}</small></div></div>`).join('')||'<p class="description">Nenhuma atualização registrada nesta demonstração.</p>'}</div></section>`;
      return `<section class="reception-summary" aria-label="Resumo da recepção"><div><strong>${d.receptionDone?'0':'3'}</strong><span>Próximas ações</span></div><div><strong>${d.receptionDone?'3':'0'}</strong><span>Conferidas hoje</span></div><div><strong>1</strong><span>Clínica atribuída</span></div></section><section class="card"><div class="section-head"><h2>${state.page==='plan'?'Minha rotina de atendimento':'Próximos passos do atendimento'}</h2>${badge('Recepção')}</div><p class="description">Clínica Aurora · acompanhe as ações da sua função. Os exemplos não contêm dados de pacientes.</p><ul class="reception-list">${[['Conferir os contatos recebidos','Confirmar responsável e próxima ação no CRM.'],['Revisar os agendamentos','Conferir o registro de confirmação na agenda.'],['Atualizar pendências do atendimento','Registrar o que depende do retorno da equipe.']].map(([t,d])=>`<li><div><strong>${t}</strong><p>${d}</p></div>${badge(data().receptionDone?'Conferido':'Hoje',data().receptionDone?'success':'')}</li>`).join('')}</ul><div class="card-actions"><span class="micro">Responsável: recepção da Clínica Aurora</span><button class="btn primary" type="button" data-action="reception-review" ${d.receptionDone?'disabled':''}>${d.receptionDone?'Rotina conferida':'Registrar conferência'} ${icon('arrow')}</button></div></section>`;
    }
    document.addEventListener('submit',event=>{
      if(event.target.id!=='demo-login')return;event.preventDefault();startDemo(state.product,loginKind());
    });
    document.addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.module){openModule(b.dataset.module);return;}
      if(b.dataset.route){go(b.dataset.route);return;}
      if(b.dataset.scene){const[p,r]=b.dataset.scene.split(':');startDemo(p,r);return;}
      if(b.dataset.section){document.getElementById(b.dataset.section)?.scrollIntoView({behavior:'instant',block:'start'});return;}
      const action=b.dataset.action;
      if(action==='showcase')showcase();
      if(action==='explore')go('/'+state.product+'/entrar');
      if(action==='logout'){const p=state.product;session=null;timers.forEach(clearTimeout);timers.clear();state.page='today';go('/'+p+'/entrar');}
      if(action==='password'){const input=document.getElementById('login-password');input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'Mostrar':'Ocultar';b.setAttribute('aria-label',input.type==='password'?'Mostrar senha':'Ocultar senha');}
      if(action==='forgot'){closeDialog();dialog.innerHTML=`${dialogHeader('Recuperar acesso','Acesso demonstrativo')}<div class="dialog-body"><p class="description">O link de recuperação é enviado ao e-mail cadastrado no produto.</p><div class="review-box"><strong>Solicitação simulada</strong><p>Nenhum e-mail foi enviado. Os acessos desta demonstração são fictícios.</p></div></div><footer class="dialog-footer"><button type="button" class="btn primary" data-action="close">Voltar ao login</button></footer>`;dialog.showModal();}
      if(action==='scope'){closeDialog();dialog.innerHTML=`${dialogHeader('Acesso individual, por função','Organização dos acessos')}<div class="dialog-body"><p class="description">HUB e SAP têm entradas e ambientes próprios. Cada acesso de clínica ou funcionário fica limitado ao produto e à clínica autorizados. Somente o administrativo pode acompanhar os dois produtos.</p><p class="micro">Nesta demonstração, os perfis são exemplos. A implementação real exige validação no servidor.</p></div><footer class="dialog-footer"><button type="button" class="btn primary" data-action="close">Entendi</button></footer>`;dialog.showModal();}
      if(action==='reception-review'&&state.role==='reception'&&state.screen==='workspace') {const d=data();d.receptionDone=true;d.events.unshift({text:'Conferência da rotina registrada',detail:'Recepção · somente nesta demonstração',status:'Concluído'});render();announce('Conferência registrada no exemplo. Nenhum contato ou agendamento real foi alterado.');}
    });
    window.addEventListener('hashchange',route);

    dialog.addEventListener('close',()=>{if(!dialog.open) modalContext=null;});
    route();
  </script>
</body>
</html>
